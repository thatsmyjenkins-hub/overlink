; CyberDeck IR + CC1101 controller
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  crankyoldgit/IRremoteESP8266@^2.8.6
  bblanchon/ArduinoJson@^7.2.1
  jgromes/RadioLib@^7.1.2
build_flags =
  -D IR_RX_PIN=14
  -D IR_TX_PIN=4
  -D CC1101_CS=5
  -D CC1101_GDO0=26
  -D CC1101_GDO2=27
  -D CORE_DEBUG_LEVEL=0

; Network update once ArduinoOTA is on the device
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = cyberdeck.local

; USB cable flash (bootstrap / recovery)
[env:esp32dev_usb]
extends = env:esp32dev
upload_protocol = esptool
