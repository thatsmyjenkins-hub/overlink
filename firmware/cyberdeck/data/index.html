<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>CyberDeck // IR·RF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="crt"></div>
  <div id="app" class="deck">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div>
          <div class="brand-title">CYBERDECK</div>
          <div class="brand-sub">IR · SUB-GHz · OPS</div>
        </div>
      </div>
      <div class="top-meta">
        <span id="linkState" class="pill warn">LINK…</span>
        <span id="heapPill" class="pill">HEAP --</span>
      </div>
    </header>

    <aside class="nav" id="nav">
      <a href="#/status" data-route="status">Status</a>
      <a href="#/setup" data-route="setup">Setup</a>
      <a href="#/network" data-route="network">Network</a>
      <a href="#/ir" data-route="ir">IR Console</a>
      <a href="#/rf" data-route="rf">RF Console</a>
      <a href="#/vault" data-route="vault">Vault</a>
      <a href="#/diag" data-route="diag">Diagnostics</a>
      <a href="#/help" data-route="help">Use Cases</a>
    </aside>

    <main class="main">
      <div id="banner" class="banner hidden"></div>
      <div id="view"></div>
    </main>

    <footer class="statusline">
      <span id="footNext">NEXT: —</span>
      <span id="footIp">IP: —</span>
      <button type="button" id="btnFooterGo" class="linkish">GO →</button>
    </footer>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
