; Overlink Core — Waveshare ESP32-S3-LCD-1.47
; USB seed (once):  pio run -e overlink-core -t upload
; Wi‑Fi update:     pio run -e overlink-core_ota -t upload
[env:overlink-core]
; pioarduino / Arduino-ESP32 3.x (installed locally as espressif32@51.3.6)
platform = espressif32 @ 51.3.6
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -I include
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

[env:overlink-core_ota]
extends = env:overlink-core
upload_protocol = espota
upload_port = overlink.local

[env:overlink-core_usb]
extends = env:overlink-core
upload_protocol = esptool
