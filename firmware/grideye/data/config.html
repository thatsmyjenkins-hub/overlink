<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CYBERDECK — Wi‑Fi Setup</title>
<style>
  :root { --bg:#0a0a1a; --card:#191930; --accent:#00d4ff; --txt:#e0e0e0; --dim:#8888aa; --ok:#00ff88; --warn:#ffaa00; --bad:#ff4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px; border-bottom:1px solid #333366; }
  h1 { margin:0; font-size:18px; color:var(--accent); letter-spacing:1px; }
  .sub { color:var(--dim); font-size:12px; margin-top:4px; }
  main { padding:16px; padding-bottom:calc(32px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  button { background:var(--accent); color:#001018; border:0; border-radius:6px; padding:11px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  button.sec { background:var(--card); color:var(--accent); border:1px solid #333366; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  ul { list-style:none; padding:0; margin:12px 0; }
  li { background:var(--card); border:1px solid #2a2a55; border-radius:6px; padding:10px 12px; margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  li.sel { border-color:var(--accent); }
  .ssid { font-weight:600; }
  .meta { color:var(--dim); font-size:12px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 4px; }
  input[type=text],input[type=password] { width:100%; padding:11px; border-radius:6px; border:1px solid #333366; background:#12122a; color:var(--txt); font-size:15px; }
  .status { margin-top:14px; padding:12px; border-radius:6px; background:var(--card); font-size:13px; min-height:20px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); } .status.work { color:var(--warn); }
  .opt { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--dim); }
  .opt input { width:auto; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CYBERDECK — WI‑FI SETUP</h1>
  <div class="sub">Configure the network the deck should join. Use the hotspot option when you want to reach the dashboard from this phone after joining.</div>
</header>
<main>
  <div class="row">
    <button id="scan" class="sec">Scan networks</button>
    <span id="scaninfo" class="meta"></span>
  </div>
  <ul id="list"></ul>

  <label for="ssid">Network (SSID)</label>
  <input id="ssid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Select above or type">
  <label for="pass">Password</label>
  <input id="pass" type="password" placeholder="Leave blank for open networks">
  <label class="opt"><input type="checkbox" id="keepap" checked> Keep CYBERDECK hotspot after joining (remote access)</label>
  <div style="margin-top:14px" class="row">
    <button id="connect">Join network</button>
    <label style="margin:0;display:flex;align-items:center;gap:6px;color:var(--dim)"><input type="checkbox" id="show" style="width:auto"> show</label>
  </div>
  <div id="status" class="status">Ready.</div>
</main>
<script>
const $ = s => document.querySelector(s);
let selected = null, polling = null;

function setStatus(msg, cls) { const e = $('#status'); e.textContent = msg; e.className = 'status' + (cls ? ' ' + cls : ''); }

async function scan(refresh) {
  $('#scan').disabled = true;
  $('#scaninfo').textContent = 'scanning…';
  try {
    const r = await fetch('/api/wifi/scan' + (refresh ? '?refresh=1' : ''));
    const j = await r.json();
    const list = $('#list'); list.innerHTML = '';
    (j.networks || []).sort((a,b) => b.rssi - a.rssi).forEach(n => {
      const li = document.createElement('li');
      const bars = n.rssi > -55 ? '||||' : n.rssi > -65 ? '|||' : n.rssi > -75 ? '||' : '|';
      li.innerHTML = `<span class="ssid">${n.ssid}${n.secure ? ' \u{1F512}' : ''}</span><span class="meta">${n.rssi} dBm ${bars}</span>`;
      li.onclick = () => { selected = n.ssid; $('#ssid').value = n.ssid; [...list.children].forEach(c => c.classList.remove('sel')); li.classList.add('sel'); $('#pass').focus(); };
      list.appendChild(li);
    });
    $('#scaninfo').textContent = (j.networks || []).length + ' found';
    if (refresh && (!j.networks || !j.networks.length)) { setStatus('Rescanning — tap Scan again in a moment.', 'work'); }
  } catch (e) { $('#scaninfo').textContent = 'scan error'; }
  $('#scan').disabled = false;
}

async function pollStatus() {
  try {
    const j = await (await fetch('/api/wifi/status')).json();
    if (j.state === 'connected' && j.connected) {
      clearInterval(polling); polling = null;
      const ap = j.apIp && j.apIp !== '0.0.0.0' ? '  Hotspot: http://' + j.apIp + '/' : '';
      setStatus('Connected. Dashboard: http://' + j.ip + '/' + ap, 'ok');
    } else if (j.state === 'failed') {
      clearInterval(polling); polling = null;
      setStatus('Join failed. Check the password and try again.', 'bad');
      $('#connect').disabled = false;
    } else {
      setStatus('Connecting to ' + (j.ssid || 'network') + '…', 'work');
    }
  } catch (e) {}
}

async function connect() {
  const ssid = $('#ssid').value.trim();
  if (!ssid) { setStatus('Enter or pick an SSID first.', 'bad'); return; }
  $('#connect').disabled = true;
  setStatus('Connecting…', 'work');
  const body = new URLSearchParams({
    ssid,
    pass: $('#pass').value,
    keepAp: $('#keepap').checked ? '1' : '0'
  });
  try {
    await fetch('/api/wifi/connect', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    if (polling) clearInterval(polling);
    polling = setInterval(pollStatus, 1500);
    pollStatus();
  } catch (e) { setStatus('Request failed.', 'bad'); $('#connect').disabled = false; }
}

$('#scan').onclick = () => scan(true);
$('#connect').onclick = connect;
$('#show').onchange = e => { $('#pass').type = e.target.checked ? 'text' : 'password'; };
scan(false);
</script>
</body>
</html>
