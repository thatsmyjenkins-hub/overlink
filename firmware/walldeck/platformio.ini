; WallDeck thin client — layout from ~/cyd-basement-control
; USB seed 2.8":   pio run -e cyd -t upload
; Wi‑Fi update:    pio run -e cyd_ota -t upload
; 3.5" capacitive: pio run -e cyd2 -t upload  (UI ready; flash when GT911 board is on USB)

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -D USER_SETUP_LOADED=1
    -include src/Setup_ESP32_2432S028R_ILI9341.h
    -D LV_USE_TFT_ESPI
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_FONT_MONTSERRAT_12=1
    -DCORE_DEBUG_LEVEL=0

board_build.partitions = min_spiffs.csv

[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = walldeck.local

[env:cyd_usb]
extends = env:cyd
upload_protocol = esptool

; ESP32-3248S035 — 3.5" 320×480 ST7796 + GT911 (CTRL 3.5 geometry)
; Touch bring-up still needs GT911 wiring in main — UI layout compiles with WALLDECK_UI_V2.
[env:cyd2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -D USER_SETUP_LOADED=1
    -include src/Setup_ESP32_2432S028R_ILI9341.h
    -D LV_USE_TFT_ESPI
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_FONT_MONTSERRAT_12=1
    -D WALLDECK_UI_V2=1
    -DCORE_DEBUG_LEVEL=0
board_build.partitions = min_spiffs.csv
